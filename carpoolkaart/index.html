<style>
  :root{--bg:#f4f1ea;--sea:#dfe6e8;--land:#ebe6da;--nl:#fbf9f4;--ink:#22231f;--muted:#6c6a62;--line:#b9b2a2;--dot:#9b2c1f;--sel:#1f5f8b}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif}
  header{padding:16px 18px 10px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  h1{font-size:20px;margin:0;font-weight:600;letter-spacing:.01em}
  header .sub{color:var(--muted);font-size:14px}
  .wrap{display:grid;grid-template-columns:1fr 300px;gap:0;border-top:1px solid var(--line)}
  @media (max-width:820px){.wrap{grid-template-columns:1fr}}
  #mapbox{position:relative;background:var(--sea);height:min(78vh,820px);min-height:420px;overflow:hidden;touch-action:none}
  svg{width:100%;height:100%;display:block;cursor:grab}
  svg:active{cursor:grabbing}
  .land{fill:var(--land);stroke:none}
  .land.nl{fill:var(--nl)}
  .border{fill:none;stroke:#a59d8b;stroke-linejoin:round}
  .dot{fill:var(--dot);stroke:#fff}
  .dot.sel{fill:var(--sel)}
  .cnt{fill:#fff;font:600 10px "IBM Plex Sans",sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .lbl{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;font-weight:500;fill:var(--ink);paint-order:stroke;stroke:rgba(251,249,244,.92);stroke-linejoin:round;pointer-events:none}
  .lbl .pl{fill:var(--muted);font-weight:400}
  .lbl.sel{fill:var(--sel)}
  .ctrl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
  .ctrl button,.views button{font:600 14px "IBM Plex Sans",sans-serif;background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:6px;min-width:36px;height:36px;padding:0 10px;cursor:pointer}
  .views{position:absolute;left:10px;top:10px;display:flex;gap:6px}
  .views button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  aside{background:#fbf9f4;border-left:1px solid var(--line);max-height:min(78vh,820px);overflow:auto}
  @media (max-width:820px){aside{border-left:0;border-top:1px solid var(--line);max-height:none}}
  .search{position:sticky;top:0;background:#fbf9f4;padding:10px 12px;border-bottom:1px solid var(--line)}
  .search input{width:100%;font:15px "IBM Plex Sans",sans-serif;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
  ul{list-style:none;margin:0;padding:0}
  li{padding:9px 14px;border-bottom:1px solid #e7e2d6;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
  li:hover{background:#f1ede3}
  li.sel{background:#e3edf4}
  li .n{font-weight:600;font-size:14px;white-space:nowrap}
  li .p{color:var(--muted);font-size:13px;text-align:right}
  footer{color:var(--muted);font-size:12px;padding:10px 18px 18px}
</style>
</head>

const svg = d3.select('#map'), zg = d3.select('#zoomg');
const ptsg = d3.select('#ptsg'), lblg = d3.select('#lblg');
let k = 1, sel = null;

// viewBox scale: 1 user unit = (rendered px / 1000)
function unitPx(){ const r = svg.node().getBoundingClientRect(); return Math.min(r.width, r.height) / 1000; }

const dots = ptsg.selectAll('g').data(PTS).join('g').attr('class','pt')

function layout(){
  const u = unitPx();
  const s = 1 / (k * u);                 // 1 screen px in map units
  const fs = 13 * s, lh = 15 * s, r = 6 * s;
  dots.select('circle').attr('r', d => d.names.length > 1 ? r * 1.35 : r).attr('stroke-width', 1.5 * s)
      .attr('class', d => 'dot' + (d === sel ? ' sel' : ''));
  dots.select('text').style('font-size', 10 * s + 'px');
  labels.style('font-size', fs + 'px').attr('stroke-width', 3 * s)
        .attr('class', d => 'lbl' + (d === sel ? ' sel' : ''));

  // greedy label placement in screen space; selected first, then west-to-east
  const placed = [];
  const order = PTS.slice().sort((a,b) => (b===sel)-(a===sel) || a.y - b.y);
  const ctx = document.createElement('canvas').getContext('2d');
  ctx.font = '500 13px "IBM Plex Sans Condensed", sans-serif';
  for (const d of order){
    const lines = d.names.length + 1;
    const w = Math.max(...d.names.map(n => ctx.measureText(n).width), ctx.measureText(d.place).width * .95) * s;
    const h = lines * lh;
    const gap = r * 1.6;
    const cands = [
      [d.x + gap, d.y - h/2 + lh*.75, 'start'],
      [d.x - gap, d.y - h/2 + lh*.75, 'end'],
      [d.x + gap*.6, d.y - gap - h + lh*.75, 'start'],
      [d.x + gap*.6, d.y + gap + lh*.75, 'start'],
      [d.x - gap*.6, d.y - gap - h + lh*.75, 'end'],
      [d.x - gap*.6, d.y + gap + lh*.75, 'end'],
    ];
    let ok = null;
    for (const [lx, ly, anchor] of cands){
      const x0 = anchor === 'start' ? lx : lx - w, y0 = ly - lh*.75;
      const box = [x0 - 2*s, y0 - 1*s, x0 + w + 2*s, y0 + h + 1*s];
      const hitsLbl = placed.some(b => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]));
      const hitsDot = PTS.some(p => p !== d && p.x > box[0]-r && p.x < box[2]+r && p.y > box[1]-r && p.y < box[3]+r);
      if (!hitsLbl && !hitsDot){ ok = [lx, ly, anchor, box]; break; }
    }
    if (!ok && d === sel){ const c = cands[0]; ok = [c[0], c[1], c[2], null]; }
    d._lbl = ok;
    if (ok && ok[3]) placed.push(ok[3]);
  }
  labels.style('display', d => d._lbl ? null : 'none').each(function(d){
    if (!d._lbl) return;
    const [lx, ly, anchor] = d._lbl;
    d3.select(this).attr('text-anchor', anchor).selectAll('tspan')
      .attr('x', lx).attr('y', (_,i) => ly + i * lh);
  });
  d3.select('.border').attr('stroke-width', 1 * s);
}

function fitTo(points, pad = 0.12, dur = 650){
  const xs = points.map(p => p.x), ys = points.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const bw = Math.max(x1 - x0, 140), bh = Math.max(y1 - y0, 140);
  const r = svg.node().getBoundingClientRect();
  // effective viewport in user units (viewBox is square, letterboxed)
  const u = Math.min(r.width, r.height) / 1000;
  const vw = r.width / u, vh = r.height / u;
  const ks = Math.min(vw / (bw * (1 + 2*pad)), vh / (bh * (1 + 2*pad)), 40);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const t = d3.zoomIdentity.translate(500, 500).scale(ks).translate(-cx, -cy);
  svg.transition().duration(dur).call(zoom.transform, t);
}

  const rows = flat.filter(r => !f || r.n.toLowerCase().includes(f) || r.p.place.toLowerCase().includes(f));
  list.selectAll('li').data(rows, r => r.n).join(enter => {
    const li = enter.append('li');
    li.append('span').attr('class','n').text(r => r.n);
    li.append('span').attr('class','p').text(r => r.p.place);
    return li;
  }).classed('sel', r => r.p === sel).on('click', (e, r) => select(r.p, true));
}
function select(p, zoomTo){
  sel = p; renderList(); layout();
  if (zoomTo){
    const near = PTS.filter(o => Math.hypot(o.x - p.x, o.y - p.y) < 45);
    fitTo(near.length > 1 ? near : [p], 0.35);
    document.getElementById('mapbox').scrollIntoView({behavior:'smooth', block:'nearest'});
  }
}
q.addEventListener('input', renderList);
renderList();
window.addEventListener('resize', layout);
document.fonts && document.fonts.ready.then(layout);
view('nl', 0);
</script>
