<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uitrusting Schütze — nieuwe leden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ebe5d4; --paper2:#e2dac5; --ink:#2a2823; --muted:#6c675a;
    --rule:#c8bea4; --accent:#9b2c1f; --accent-soft:rgba(155,44,31,.12);
    --card:#f4f0e4; --ok:#3f6b3a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink)}
  body{font-family:"Source Serif 4",Georgia,serif;font-size:16px;line-height:1.5;
    background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:4px 4px}
  header{padding:22px 28px 14px;border-bottom:2px solid var(--ink);display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between}
  header h1{font-family:"UnifrakturMaguntia",serif;font-weight:400;font-size:40px;line-height:1;margin:0;letter-spacing:.5px}
  header .sub{font-family:"IBM Plex Mono",monospace;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
  .progress{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);text-align:right}
  .bar{width:180px;height:6px;background:var(--paper2);border:1px solid var(--rule);margin-top:5px}
  .bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}

  main{display:grid;grid-template-columns:minmax(320px,1fr) minmax(320px,440px);gap:0;min-height:calc(100vh - 90px)}
  .left{padding:18px 24px 28px;border-right:1px solid var(--rule)}
  .right{padding:22px 26px 32px;background:var(--card);position:relative}
  .right .sticky{position:sticky;top:18px}

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
  .viewlabel{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  button{font:inherit;cursor:pointer}
  .btn{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    background:var(--ink);color:var(--paper);border:0;padding:8px 12px;border-radius:2px}
  .btn:hover{background:#000}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
  .btn.ghost:hover{background:var(--accent-soft)}

  .stage{perspective:1400px;height:min(80vh,1150px);width:auto;max-width:100%;margin:0 auto;aspect-ratio:400/940;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
  .stage.dragging{cursor:grabbing}
  .card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
  .card.nodelay{transition:none}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .face.back{transform:rotateY(180deg)}
  .face svg{width:100%;height:100%;display:block}
  .hint{text-align:center;font-size:13px;color:var(--muted);margin:4px 0 14px;font-style:italic}

  .face svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hit{cursor:pointer}
  .face img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
  polygon.hit{fill:transparent;stroke:transparent;stroke-width:2px;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .15s}
  polygon.hit:hover{fill:rgba(60,55,45,.10);stroke:rgba(60,55,45,.6)}
  .stage.show polygon.hit{fill:rgba(60,55,45,.06);stroke:rgba(60,55,45,.55);stroke-dasharray:5 4}
  polygon.hit.sel,.stage.show polygon.hit.sel{fill:rgba(155,44,31,.18);stroke:#b3382a;stroke-width:2.5px;stroke-dasharray:none}
  .hit .f{transition:fill .15s}
  .hit:hover .f{fill:#e8dbb2}
  .stage.show .hit .f{fill:#ebdfba}
  .hit.sel .f,.stage.show .hit.sel .f{fill:#efc6b3}
  .nohit{pointer-events:none}

  .tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);font-family:"IBM Plex Mono",monospace;
    font-size:12px;padding:4px 8px;border-radius:2px;opacity:0;transform:translate(12px,-26px);transition:opacity .12s;z-index:10;white-space:nowrap}
  .tip.on{opacity:1}

  .chips h3,.panel h4{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;border-bottom:1px solid var(--rule);padding-bottom:4px}
  .chiprow{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--rule);background:var(--card);padding:5px 9px;border-radius:2px;font-size:14px;line-height:1.2;display:flex;align-items:center;gap:6px}
  .chip:hover{border-color:var(--ink)}
  .chip.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .chip .dot{width:8px;height:8px;border-radius:50%;border:1px solid currentColor;flex:none}
  .chip.have .dot{background:var(--ok);border-color:var(--ok)}

  .panel .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .panel h2{font-size:30px;line-height:1.1;margin:6px 0 2px;font-weight:700}
  .panel .nl{font-style:italic;color:var(--muted);margin:0 0 12px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tag{font-family:"IBM Plex Mono",monospace;font-size:11px;padding:2px 7px;border:1px solid var(--ink);border-radius:2px}
  .tag.basis{background:var(--ink);color:var(--paper)}
  .panel p{margin:0 0 10px}
  .panel ul{margin:0;padding-left:18px}
  .panel li{margin:3px 0}
  .contents{list-style:none;padding:0!important;border-top:1px solid var(--rule)}
  .contents li{display:grid;grid-template-columns:18px 1fr;gap:6px;padding:7px 0;border-bottom:1px dotted var(--rule);margin:0}
  .contents li b{font-weight:600}
  .contents li span.n{color:var(--muted);font-size:14px;display:block}
  .contents .num{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--accent);padding-top:3px}
  .buy{border:1px solid var(--ink);padding:12px 14px;margin-top:6px;background:var(--paper)}
  .buy.empty{border-style:dashed;border-color:var(--muted);color:var(--muted);background:transparent}
  .buy a{color:var(--accent);font-weight:600}
  .buy .shop{font-weight:700;font-size:17px}
  .shops{margin:0;padding-left:20px!important}
  .shops li{margin:2px 0}
  .shops li::marker{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--accent)}
  .shops .noot{display:block;font-size:13px;color:var(--muted)}
  .buy .shop{font-weight:700;font-size:16px}
  .buy .opm{margin:10px 0 0;padding-top:8px;border-top:1px dotted var(--rule)}
  .buy .datum{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);margin-top:8px}
  .overleg{font-size:13px;color:var(--accent);margin:8px 0 0;font-weight:600}
  .have{display:flex;align-items:center;gap:8px;margin:16px 0 0;font-size:15px;cursor:pointer}
  .have input{width:18px;height:18px;accent-color:var(--ok)}
  .nav{display:flex;justify-content:space-between;gap:8px;margin-top:18px}
  .empty-state{color:var(--muted)}
  .empty-state h2{color:var(--ink)}
  .legal{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:10px 0}
  .back-up{display:none}

  @media (max-width:820px){
    header{padding:16px 16px 10px}
    header h1{font-size:30px}
    main{grid-template-columns:1fr}
    .left{border-right:0;padding:12px 14px 6px}
    .right{padding:18px 16px 28px;border-top:2px solid var(--ink)}
    .right .sticky{position:static}
    .stage{height:72vh}
    .back-up{display:inline-block}
  }
</style>
</head>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const byId = Object.fromEntries(ITEMS.map(i => [i.id, i]));
  const order = ITEMS.map(i => i.id);
  const onFigure = new Set([...document.querySelectorAll('.hit')].map(g => g.dataset.id));
  const frontIds = new Set([...document.querySelectorAll('.front .hit')].map(g => g.dataset.id));
  const backIds = new Set([...document.querySelectorAll('.back .hit')].map(g => g.dataset.id));
  $('#eenheid').textContent = GROEP.eenheid;

  // ---- bezit (per bezoeker, in deze browser) ----
  let have = {};
  try { have = JSON.parse(localStorage.getItem('uitrusting-bezit') || '{}'); } catch(e){}
  const saveHave = () => { try { localStorage.setItem('uitrusting-bezit', JSON.stringify(have)); } catch(e){} };

  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ---- chips ----
  function renderChips(){
    const groups = {};
    ITEMS.forEach(i => (groups[i.groep] ||= []).push(i));
    $('#chips').innerHTML = Object.entries(groups).map(([g, list]) =>
      `<h3>${esc(g)}</h3><div class="chiprow">` +
      list.map(i => `<button type="button" class="chip${have[i.id]?' have':''}${i.id===current?' sel':''}" data-id="${i.id}"><span class="dot"></span>${esc(i.naam)}</button>`).join('') +
      `</div>`).join('');
  }

  function renderProgress(){
    const req = ITEMS.filter(i => i.minimaal); const n = req.filter(i => have[i.id]).length;
    $('#progText').textContent = `${n} van ${req.length} minimale stukken in bezit`;
    $('#progBar').style.width = (100*n/req.length) + '%';
  }

  // ---- paneel ----
  let current = null;
  function renderPanel(){
    const p = $('#panel');
    if(!current){
      p.innerHTML = `<div class="empty-state">
        <div class="eyebrow">Welkom bij de groep</div>
        <h2>Wat heb je nodig?</h2>
        ${GROEP.intro.map(t=>`<p>${esc(t)}</p>`).join('')}
        <p><b style="color:var(--ink)">Minimaal</b> = staat in het adviesdocument, nodig voor je eerste evenement. <b style="color:var(--ink)">Aanvulling</b> = later, na overleg.</p>
        <p style="font-size:13px">Bron: ${esc(GROEP.versie)}</p>
      </div>`;
      return;
    }
    const i = byId[current];
    const k = i.koop || {};
    const idx = order.indexOf(current);
    const prev = byId[order[(idx-1+order.length)%order.length]];
    const next = byId[order[(idx+1)%order.length]];
    let where = '';
    if(onFigure.has(i.id)){
      const f = frontIds.has(i.id), b = backIds.has(i.id);
      where = f && b ? 'Voor- en achterkant' : f ? 'Zichtbaar van voren' : 'Zichtbaar van achteren';
    } else where = 'Niet zichtbaar op de figuur';

    p.innerHTML = `
      <div class="eyebrow">${esc(i.groep)}</div>
      <h2>${esc(i.naam)}</h2>
      <p class="nl">${esc(i.nl)}</p>
      <div class="tags">
        <span class="tag ${i.minimaal?'basis':''}">${i.minimaal?'Minimaal':'Aanvulling'}</span>
        ${i.variant ? `<span class="tag">${esc(i.variant)}</span>` : ''}
        <span class="tag">${where}</span>
      </div>
      <p>${esc(i.tekst)}</p>
      ${i.juridisch ? `<div class="legal">${esc(i.juridisch)}</div>` : ''}
      ${i.inhoud ? `<h4>Wat hoort erin</h4><ul class="contents">${i.inhoud.map((c,n)=>`<li><span class="num">${String(n+1).padStart(2,'0')}</span><div><b>${esc(c.n)}</b><span class="n">${esc(c.t)}</span></div></li>`).join('')}</ul>` : ''}
      ${i.letop ? `<h4>Let op</h4><ul>${i.letop.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>` : ''}
      <h4>Waar kopen — advies van de groep</h4>
      ${(k.opties && k.opties.length) ? `<div class="buy"><ol class="shops">${k.opties.map(o=>`<li><span class="shop">${o.url?`<a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.naam)}</a>`:esc(o.naam)}</span>${o.noot?`<span class="noot">${esc(o.noot)}</span>`:''}</li>`).join('')}</ol>
          ${k.opmerking ? `<p class="opm">${esc(k.opmerking)}</p>` : ''}
          ${k.datum ? `<div class="datum">Advies d.d. ${esc(k.datum)}</div>` : ''}</div>`
        : `<div class="buy empty">${k.opmerking?esc(k.opmerking)+' ':''}Nog geen advies in het adviesdocument. Overleg met je begeleidend lid.</div>`}
      <p class="overleg">Overleg altijd eerst met je begeleidend lid voordat je iets bestelt.</p>
      <label class="have"><input type="checkbox" id="haveBox" ${have[i.id]?'checked':''}> Heb ik al</label>
      <div class="nav">
        <button class="btn ghost" type="button" data-go="${prev.id}">← ${esc(prev.naam.split(' ')[0])}</button>
        <button class="btn ghost back-up" type="button" id="backUp">↑ Figuur</button>
        <button class="btn ghost" type="button" data-go="${next.id}">${esc(next.naam.split(' ')[0])} →</button>
      </div>`;
    $('#haveBox').addEventListener('change', e => { have[i.id] = e.target.checked; if(!have[i.id]) delete have[i.id]; saveHave(); renderChips(); renderProgress(); });
    p.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => select(b.dataset.go, true)));
    const bu = $('#backUp'); if(bu) bu.addEventListener('click', () => $('#stage').scrollIntoView({behavior:'smooth', block:'start'}));
  }

  function select(id, fromNav){
    if(!byId[id]) return;
    current = id;
    document.querySelectorAll('.hit').forEach(g => g.classList.toggle('sel', g.dataset.id === id));
    // draai mee als het stuk alleen aan de andere kant zichtbaar is
    {
      if(flipped && frontIds.has(id) && !backIds.has(id)) setFlip(false);
      else if(!flipped && backIds.has(id) && !frontIds.has(id)) setFlip(true);
    }
    renderPanel(); renderChips();
    if(location.hash !== '#'+id) history.replaceState(null, '', '#'+id);
    if(window.matchMedia('(max-width:820px)').matches && !fromNav){
      $('#panelWrap').scrollIntoView({behavior:'smooth', block:'start'});
    }
  }

  // ---- draaien ----
  let flipped = false, angle = 0;
  const card = $('#card'), stage = $('#stage');
  function setFlip(v){
    flipped = v; angle = v ? 180 : 0;
    card.classList.remove('nodelay');
    card.style.transform = `rotateY(${angle}deg)`;
    $('#viewLabel').textContent = v ? 'Achteraanzicht' : 'Vooraanzicht';
  }
  $('#flipBtn').addEventListener('click', () => setFlip(!flipped));
  $('#showBtn').addEventListener('click', () => { const on = stage.classList.toggle('show'); $('#showBtn').textContent = on ? 'Verberg klikvlakken' : 'Toon klikvlakken'; });

  let dragStart = null, dragged = false;
  stage.addEventListener('pointerdown', e => { dragStart = {x:e.clientX, a:angle}; dragged = false; });
  window.addEventListener('pointermove', e => {
    if(!dragStart) return;
    const dx = e.clientX - dragStart.x;
    if(Math.abs(dx) > 6){
      if(!dragged){ dragged = true; stage.classList.add('dragging'); card.classList.add('nodelay'); try{stage.setPointerCapture(e.pointerId)}catch(_){} }
      angle = dragStart.a + dx * 0.7;
      card.style.transform = `rotateY(${angle}deg)`;
    }
  });
  window.addEventListener('pointerup', () => {
    if(!dragStart) return;
    dragStart = null; stage.classList.remove('dragging');
    if(dragged){
      const norm = ((angle % 360) + 360) % 360;
      const back = norm > 90 && norm < 270;
      // snap naar dichtstbijzijnde zijde
      angle = Math.round(angle/180)*180;
      card.classList.remove('nodelay');
      card.style.transform = `rotateY(${angle}deg)`;
      flipped = back;
      $('#viewLabel').textContent = back ? 'Achteraanzicht' : 'Vooraanzicht';
    }
  });

  // ---- klikken & tooltip ----
  const tip = $('#tip');
  document.querySelectorAll('.hit').forEach(g => {
    g.addEventListener('click', e => { if(dragged){ e.preventDefault(); return; } select(g.dataset.id); });
    g.addEventListener('pointerenter', () => { tip.textContent = byId[g.dataset.id]?.naam || ''; tip.classList.add('on'); });
    g.addEventListener('pointerleave', () => tip.classList.remove('on'));
  });
  window.addEventListener('pointermove', e => { tip.style.left = e.clientX+'px'; tip.style.top = e.clientY+'px'; });
  $('#chips').addEventListener('click', e => { const c = e.target.closest('.chip'); if(c) select(c.dataset.id); });

  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if(h && h !== current) select(h, true); });

  renderChips(); renderProgress(); renderPanel();
  const h = location.hash.slice(1); if(byId[h]) select(h, true);
})();
</script>
